<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Proxy — PII Inspector</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface-hover: #252525;
            --border: #333;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, monospace;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .input-section {
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.875rem;
            padding: 1rem;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
        }

        button {
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.625rem 1.25rem;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats {
            display: flex;
            gap: 1.5rem;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .stat-value {
            color: var(--text);
            font-weight: 600;
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 768px) {
            .results {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-header {
            background: var(--surface-hover);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .panel-content {
            padding: 1rem;
            font-size: 0.875rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 400px;
            overflow-y: auto;
        }

        .token {
            background: var(--accent);
            color: white;
            padding: 0.125rem 0.375rem;
            border-radius: 3px;
            font-size: 0.8125rem;
        }

        .detection-list {
            list-style: none;
        }

        .detection-item {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .detection-item:last-child {
            border-bottom: none;
        }

        .detection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.375rem;
        }

        .detection-type {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.125rem 0.5rem;
            border-radius: 3px;
            background: var(--surface-hover);
        }

        .detection-type.high {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        .detection-type.medium {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .detection-type.low {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .detection-confidence {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .detection-text {
            font-size: 0.875rem;
            word-break: break-all;
        }

        .detection-meta {
            font-size: 0.6875rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .empty-state {
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
        }

        .loading {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--text-muted);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔒 Privacy Proxy Inspector</h1>
            <p class="subtitle">
                Test PII detection before sending to upstream APIs.
                Detects names, emails, API keys, SSNs, credit cards, and 40+ entity types.
            </p>
        </header>

        <div class="input-section">
            <textarea id="input" placeholder="Paste text containing PII to test detection...
Example:
Hi, I'm Sarah Chen from Acme Corp. My email is sarah.chen@acme.io and my API key is sk-abc123def456ghi789jklmnop.
The server logs are at /home/sarah/logs/app.log and the customer's card is 4532015112830366. Contact me at +1 (555) 867-5309.
My SSN is 123-45-6789 and the payment goes to IBAN DE89370400440532013000."></textarea>

            <div class="controls">
                <button id="inspectBtn" onclick="inspect()">
                    Inspect PII
                </button>
                <div class="stats" id="stats"></div>
            </div>
        </div>

        <div class="results" id="results" style="display: none;">
            <div class="panel">
                <div class="panel-header">Masked Output</div>
                <div class="panel-content" id="maskedOutput"></div>
            </div>

            <div class="panel">
                <div class="panel-header">Detected Entities</div>
                <div class="panel-content" id="detections" style="padding: 0;"></div>
            </div>
        </div>
    </div>

    <script>
        async function inspect() {
            const btn = document.getElementById('inspectBtn');
            const input = document.getElementById('input');
            const results = document.getElementById('results');
            const stats = document.getElementById('stats');
            const maskedOutput = document.getElementById('maskedOutput');
            const detections = document.getElementById('detections');

            const text = input.value.trim();
            if (!text) return;

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>';

            try {
                const res = await fetch('/inspect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await res.json();

                // Update stats
                const typesList = Object.entries(data.entity_types)
                    .map(([type, count]) => `${type}: ${count}`)
                    .join(', ');

                stats.innerHTML = `
                    <span class="stat">
                        <span>Entities:</span>
                        <span class="stat-value">${data.entity_count}</span>
                    </span>
                    ${typesList ? `<span class="stat">${typesList}</span>` : ''}
                `;

                // Highlight tokens in masked output
                let highlighted = escapeHtml(data.masked);
                highlighted = highlighted.replace(
                    /&lt;([A-Z_]+_\d+)&gt;/g,
                    '<span class="token">&lt;$1&gt;</span>'
                );
                maskedOutput.innerHTML = highlighted;

                // Show detections
                if (data.detections.length === 0) {
                    detections.innerHTML = '<div class="empty-state">No PII detected</div>';
                } else {
                    detections.innerHTML = `
                        <ul class="detection-list">
                            ${data.detections.map(d => {
                                const conf = d.confidence;
                                const confClass = conf >= 0.9 ? 'high' : conf >= 0.7 ? 'medium' : 'low';
                                return `
                                    <li class="detection-item">
                                        <div class="detection-header">
                                            <span class="detection-type ${confClass}">${d.type}</span>
                                            <span class="detection-confidence">${(conf * 100).toFixed(1)}%</span>
                                        </div>
                                        <div class="detection-text">${escapeHtml(d.text)}</div>
                                        <div class="detection-meta">
                                            chars ${d.start}&ndash;${d.end} &middot; ${d.source}
                                        </div>
                                    </li>
                                `;
                            }).join('')}
                        </ul>
                    `;
                }

                results.style.display = 'grid';

            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Inspect PII';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Ctrl+Enter to submit
        document.getElementById('input').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                inspect();
            }
        });
    </script>
</body>
</html>
